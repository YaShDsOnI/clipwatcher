[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-watcher"
dynamic = ["version"]
description = "Live-stream clipping for Twitch, driven by chat: when chat explodes, the moment becomes a captioned vertical clip."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "clipwatcher/fonts/Montserrat-OFL.txt"]
authors = [{ name = "Yash Soni" }]
keywords = ["twitch", "clips", "live-streaming", "shorts", "instagram", "reels", "whisper", "captions", "ffmpeg", "streamlink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Conversion",
]
# Recording only needs streamlink (and ffmpeg on PATH, which pip can't install).
# Everything else is optional: a missing part just switches its feature off.
dependencies = ["streamlink>=7"]

[project.optional-dependencies]
captions = ["faster-whisper>=1.1"]          # word-synced captions; needs Python 3.12-3.14 (64-bit)
speakers = ["sherpa-onnx>=1.10", "numpy"]   # a caption colour per speaker
claude = ["anthropic>=2.0"]                 # only for Claude hook titles; other AI providers need nothing
all = ["clip-watcher[captions,speakers,claude]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/YaShDsOnI/clipwatcher"
Issues = "https://github.com/YaShDsOnI/clipwatcher/issues"

[project.scripts]
clip-watcher = "clipwatcher.__main__:main"

[tool.setuptools]
packages = ["clipwatcher"]

[tool.setuptools.package-data]
clipwatcher = ["web/*", "fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "clipwatcher.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E741",   # `l` as a label variable in the speaker clustering reads fine there
    "B008",   # argparse defaults computed at parse time are intended
]

[tool.ruff.lint.per-file-ignores]
"clipwatcher/captions.py" = ["E501"]   # ASS subtitle style lines are long by format
