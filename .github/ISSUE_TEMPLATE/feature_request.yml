name: Feature request
description: An idea to make clip-watcher better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: "Optional. Settings, buttons, commands: whatever you have in mind."
